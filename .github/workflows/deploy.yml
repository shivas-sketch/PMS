name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/pms

            # Force VM to match latest main branch
            git fetch origin
            git reset --hard origin/main

            # Build frontend
            cd /home/ubuntu/pms/frontend
            npm ci
            npm run build

            # Update backend dependencies and restart
            cd /home/ubuntu/pms/backend
            source .venv/bin/activate
            pip install -r requirements.txt

            # Restart services
            sudo systemctl restart pms-backend
            sudo systemctl reload nginx

            # Health check with retries (backend can take 10-30s to start ML models)
            for i in {1..30}; do
              if curl -sf http://localhost:80/api/parking/capacity >/dev/null; then
                echo 'Health check passed'
                break
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 2
            done

            # Final check
            curl -sf http://localhost:80/api/parking/capacity
